# An example machine file for a real machine whose Intel AMT is release
# 16.1 or later, which serves nothing in the clear: a Dell Precision 3660
# Tower (Core i9-12900, AMT 16). Copy it to ~/.config/dukovo-lab/machines/,
# put in the machine's MAC address and its disk's serial number, and run
# `dukovo-lab machines check precision`: with no pin yet, it prints the
# pin AMT's key has. docs/real-machines.md sets the machine and the lab PC
# up; docs/machine-files.md lists every key.

about = "Dell Precision 3660 Tower, Core i9-12900, Intel AMT 16"
driver = "amt"

[amt]
# AMT's address, set in MEBx (Ctrl+P as the machine starts).
address = "10.77.0.15"
# AMT's password alone, in a file beside this one: chmod 600.
password_file = "precision-amt-password"
# AMT's TLS key, as `dukovo-lab machines check` prints it: put the line
# it prints here, in place of this one. It turns TLS on for power, the
# console and the screen, and the lab trusts no other key.
# pin = "sha256//..."
# The network card's MAC address, from the firmware setup or `ip link`.
mac = "00:00:00:00:00:00"
# The serial number of the disk each test's image is written to, from
# `lsblk -o NAME,SERIAL`. No other disk is ever written.
disk = "SERIAL-OF-THE-SSD"
# Its address on the lab network, and the first of its four net-boot
# ports: each machine of a run needs its own.
machine_address = "10.77.0.5"
boot_port = 7443
# With no serial port named, the console comes from AMT's
# Serial-over-LAN (ttyS4).

[controls]
# Cables and sticks are handled by a person at the machine.
link = "person"
usb = "person"
