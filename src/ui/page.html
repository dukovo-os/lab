<!--
SPDX-FileCopyrightText: 2026 The Dukovo contributors
SPDX-License-Identifier: Apache-2.0 OR MIT

The runner page. dukovo-lab ui serves it on 127.0.0.1 (and, read only, on the
address given to --share); page.js draws one
view at a time in #view, chosen by the address's hash, from the answers of
dukovo-lab commands run through the server (see ui.rs).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukovo Lab</title>
<link rel="stylesheet" href="/page.css">
<script src="/page.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">Dukovo lab</div>
  <nav aria-label="Main" id="nav">
    <a href="#home" data-view="home">Home</a>
    <a href="#tests" data-view="tests">Tests</a>
    <a href="#findings" data-view="findings">Findings</a>
    <a href="#fleet" data-view="fleet">Fleet</a>
    <a href="#runs" data-view="runs">Past runs</a>
  </nav>
  <div class="runstate" id="runstate">
    <a href="#runs" id="runstate-text"><span class="dot idle"></span><span>Loading…</span></a>
    <a class="btn ink" href="#start" id="start-run" data-act>Start run</a>
  </div>
</header>
<main class="page" id="page">
  <p class="notice" id="notice" role="status" hidden></p>
  <div id="view" tabindex="-1"></div>
</main>
<p id="last-command"></p>
</body>
</html>
