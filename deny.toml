# cargo-deny policy, as Dukovo's own: dependencies come from crates.io
# under licenses compatible with Apache-2.0 OR MIT.

[advisories]
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
