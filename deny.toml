# cargo-deny policy, as Dukovo's own: dependencies come from crates.io
# under licenses compatible with Apache-2.0 OR MIT. ISC comes with ring,
# rustls-webpki and untrusted, and BSD-3-Clause with subtle, all of them
# under rustls, which the AMT driver's TLS uses.

[advisories]
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
